services:
  db:
    image: postgis/postgis:16-3.4
    container_name: rc_db
    environment:
      POSTGRES_USER: rc
      POSTGRES_PASSWORD: rc_pass
      POSTGRES_DB: residue
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: rc_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: