version: "3.9"

services:
  # ── PostgreSQL + PostGIS ─────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: rc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rc
      POSTGRES_PASSWORD: rc_pass
      POSTGRES_DB: residue
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rc -d residue"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rc_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ──────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rc_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rc:rc_pass@db:5432/residue
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        python scripts/load_seed.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # ── Celery worker ────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rc_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rc:rc_pass@db:5432/residue
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.workers.task_runner._celery_app worker --loglevel=info

  # ── Celery beat (scheduler) ───────────────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rc_beat
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rc:rc_pass@db:5432/residue
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: "false"
    depends_on:
      - worker
    volumes:
      - ./backend:/app
    command: celery -A app.workers.task_runner._celery_app beat --loglevel=info

volumes:
  pgdata:
