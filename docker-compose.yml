# ── Production / Staging Compose ──────────────────────────────────────────────
# Required environment variables (.env):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
#   DATABASE_URL, SECRET_KEY, CORS_ORIGINS
#
# - Database and Redis stay strictly on the internal Docker network (no host ports).
# - API, worker, and beat run from the built image (no source bind-mounts).
# - Caddy terminates TLS on :443 and proxies to api:8000.
# - Schema changes are applied exclusively via Alembic (`python scripts/init_db.py`).

services:
  # ── PostgreSQL + PostGIS (internal only) ───────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (internal only) ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend (internal only; exposed via Caddy TLS) ─────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL:    redis://redis:6379/0
      SECRET_KEY:   ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DEMO_MODE:    "false"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    command: >
      sh -c "
        python scripts/init_db.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ── TLS Reverse Proxy (Caddy) ──────────────────────────────────────────────
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  # ── Celery worker ──────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL:    redis://redis:6379/0
      SECRET_KEY:   ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DEMO_MODE:    "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    command: celery -A app.workers.task_runner._celery_app worker --loglevel=info

  # ── Celery beat (scheduler) ────────────────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL:    redis://redis:6379/0
      SECRET_KEY:   ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DEMO_MODE:    "false"
    depends_on:
      - worker
    networks:
      - internal
    command: celery -A app.workers.task_runner._celery_app beat --loglevel=info

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
