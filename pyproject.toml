[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "residue-compass-economics"
version = "0.1.0"
description = "Part 4: Economics, Matching and Validation for Residue Compass"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Residue Compass Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Agricultural Information",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
api = [
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
]

[tool.setuptools.packages.find]
where = ["src"]
